# NEXI source-only CodeQL security, quality, and architecture scanning.
# GitHub-hosted analysis only; application build/deploy and financial/runtime mutations are excluded.
name: NEXI CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: nexi-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL security, quality and NEXI architecture rules
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.language == 'javascript-typescript' && 'security-and-quality,./.github/codeql/queries/RetiredCloudflareRuntime.ql' || 'security-and-quality' }}
      - name: Analyze and upload SARIF
        uses: github/codeql-action/analyze@v4
        with:
          category: nexi/${{ matrix.language }}
          output: codeql-results
      - name: Save CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexi-codeql-sarif-${{ matrix.language }}
          path: codeql-results/
          retention-days: 7
          if-no-files-found: warn
