# Include this file from nginx's http{} block only after the API and public TLS
# certificates are ready. Cloudflare routing is unchanged until cutover.
map $http_upgrade $nexi_connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    server_name api.nexitrading.app;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.nexitrading.app;
    ssl_certificate /etc/letsencrypt/live/nexitrading.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexitrading.app/privkey.pem;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nexi_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
