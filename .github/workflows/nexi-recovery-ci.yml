name: NEXI Recovery CI

on:
  push:
    branches:
      - codex/vm-authoritative-sync-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --runInBand test/market/biquote-market.adapter.spec.ts test/market/binance-spot.adapter.spec.ts test/market/non-crypto-market.adapters.spec.ts
      - run: NODE_OPTIONS=--max-old-space-size=8192 npm run build

  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install 'graphifyy[sql]'
      - run: graphify --version
      - run: graphify update backend --no-cluster

  cloudflare-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-container-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx --no-install wrangler --version
      - run: npm run validate:worker

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-container-bootstrap/dexi-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
