version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dexi_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:5432/dexi_db
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      JWT_SECRET: supersecretkey
      PORT: 3001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dexi_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001

  postgres:
    image: postgres:15-alpine
    container_name: dexi_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dexi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: dexi_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
