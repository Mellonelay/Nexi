name: NEXI VPS Source CI
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Admin/**'
      - '.github/workflows/nexi-recovery-ci.yml'
      - '.fallowrc.jsonc'
      - 'docs/contracts/openapi.json'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Admin/**'
      - '.github/workflows/nexi-recovery-ci.yml'
      - '.fallowrc.jsonc'
      - 'docs/contracts/openapi.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexi-vps-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      admin: ${{ steps.scope.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify changed source roots
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'backend=true\nfrontend=true\nadmin=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          git diff --name-only "$base" "$head" > /tmp/nexi-changed-paths
          for component in backend frontend Admin; do
            name="${component,,}"
            if grep -Eq "^(${component}/|\.github/workflows/nexi-recovery-ci\.yml$|\.fallowrc\.jsonc$|docs/contracts/openapi\.json$)" /tmp/nexi-changed-paths; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${name}=false" >> "$GITHUB_OUTPUT"
            fi
          done
  graphify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphify CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'graphifyy[sql]'
          graphify --version
      - name: Build code graph from current source
        run: graphify update backend --no-cluster
      - name: Publish code graph diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexi-graphify-current-source
          path: backend/graphify-out/
          if-no-files-found: warn
          retention-days: 7

  nestjs-doctor:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: NestJS Doctor — backend source, advisory
        uses: RoloBits/nestjs-doctor@bfc83dafb95b59d45d879d8756f01c1cf89054ab # v1
        with:
          directory: backend
          scope: changed
          blocking: none
          comment: false
          review-comments: false

  fallow:
    needs: detect
    if: needs.detect.outputs.backend == 'true' || needs.detect.outputs.frontend == 'true' || needs.detect.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fallow — monorepo source analysis
        uses: fallow-rs/fallow@3c6e45b55ae60a52caa2b586ea3fae44f3e5a44e # v3
        with:
          root: .
          config: .fallowrc.jsonc
          production: 'true'
          format: sarif
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'true'
          annotations: 'true'

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Verify OpenAPI snapshot from current NestJS source
        run: |
          NEXI_LOCAL_SQLITE_PATH=/tmp/nexi-openapi-ci-preview.sqlite npm run generate:openapi
          git diff --exit-code -- ../docs/contracts/openapi.json
      - name: Source and dependency contracts
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies['@prisma/adapter-d1'])process.exit(1)"
          test ! -f src/d1/d1-remote-database.ts
          ./node_modules/.bin/tsc --noEmit -p tsconfig.build.json
      - run: npm run build
  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  admin:
    needs: detect
    if: needs.detect.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.14.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: Admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run build
